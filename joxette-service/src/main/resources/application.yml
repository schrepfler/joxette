spring:
  application:
    name: joxette
  main:
    allow-circular-references: true
  # Disable Spring auto-config for Kafka (we use Jox Kafka directly)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ---------------------------------------------------------------------------
# Joxette configuration
# ---------------------------------------------------------------------------
joxette:

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Capability opt-outs — all capabilities are enabled by default.
  # Every node with a catalog attached can serve recording, replay, and compaction.
  # Set these to false only for resource-isolation reasons (e.g. a dedicated
  # analytics node that should not consume Kafka partitions).
  #
  #   recording.enabled=false  — skip Kafka consumer startup on this node;
  #                              catalog, replay API, and compaction still active.
  #   compaction.enabled=false — skip scheduled compaction/retention jobs;
  #                              POST /compaction/trigger still works manually.
  #                              compaction_locks prevents concurrent runs anyway.
  #
  # Example: analytics/replay-only node
  #   joxette.recording.enabled: false
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Pekko cluster configuration
  # ---------------------------------------------------------------------------
  # remote-port: 0 = OS-assigns a free port (default; suitable for local dev).
  # Set an explicit port (e.g. 2551) for multi-node deployments so seed-node
  # addresses in pekko.conf are stable.
  # Override via env-var: JOXETTE_PEKKO_REMOTE-PORT=2551
  pekko:
    remote-port: 0

  # ---------------------------------------------------------------------------
  # Clustering (how this process joins a Pekko cluster)
  # ---------------------------------------------------------------------------
  # mode:
  #   catalog          (default) — each process self-joins a one-member cluster;
  #                    cross-process coordination is via the shared catalog
  #                    (compaction_locks + heartbeat registry) and the Kafka
  #                    consumer group. The only safe option with an embedded
  #                    catalog, and the mode used for all local dev and tests.
  #   pekko-management — Cluster Bootstrap forms a real shared cluster via
  #                    kubernetes-api discovery; the compaction ClusterSingleton
  #                    becomes genuinely cluster-wide (k8s-lease-backed SBR).
  #                    Requires running in Kubernetes with the RBAC + headless
  #                    Service from docs/operator-design.md §8.2.
  # Override via env-var: JOXETTE_CLUSTERING_MODE=pekko-management
  clustering:
    mode: catalog
    # The following apply only when mode=pekko-management:
    management-port: 7626              # Cluster Bootstrap contact-point + health HTTP port
    service-name: joxette              # substituted into pod-label-selector and discovery
    pod-label-selector: "app.kubernetes.io/name=%s"
    required-contact-point-nr: 1       # set to the recorder/compaction tier replica count

  catalog:
    path: "./data/joxette.ducklake"
    object-storage-path: "s3://joxette-data/"
    # auto-migrate: true   # set false to skip automatic catalog migration on startup (DuckLake 1.0+)
    # metadata-query-logging: true   # enables DuckLakeMetadata catalog query tracing (DuckLake 1.0+)
    # inlining-row-limit: 0          # 0 = disable inlining, always write Parquet directly (DuckLake 1.0+ PR #923)
    #   Records per-query elapsed times for ATTACH, ducklake_migrate(), and schema setup.
    #   Entries are drained to SLF4J after startup (and after compaction runs) via:
    #     logging:
    #       level:
    #         com.joxette.catalog.ducklake: DEBUG

  inline:
    threshold-mb: 4
    threshold-records: 50000

  retention:
    schedule: "0 0 1 * * *"

  compaction:
    schedule: "0 0 3 * * *"
    # lock-ttl-minutes: 240              # default — must comfortably exceed worst-case merge
    #   duration; the heartbeat cannot extend it during an in-progress merge (see docs/clustering-deployment.md §4.2)
    dead-instance-threshold-minutes: 30  # cleanLocksForDeadInstances() dead-instance check.
    #   Deliberately independent of InstanceRegistry's own 90s/2min alive/stale thresholds,
    #   which exist for GET /instances dashboard freshness, not lock-stealing safety — a
    #   merge can legitimately block the heartbeat thread past 90s (see docs/clustering-deployment.md §4.2).
    snapshot-retention-hours: 0  # TEMP: was the 24h default — set to 0 to force-reclaim disk
    #   space on the next compaction run instead of waiting out the window. Put back to 24
    #   (or remove this line) once you're done, or every snapshot becomes cleanup-eligible
    #   immediately, including ones you might want to /cassettes/snapshots/{id}/restore.
    entity:
      min-files-per-bucket: 10
      target-file-size-mb: 256
      lookback-days: 0  # TEMP: was the 30-day default — set to 0 so compaction will actually
      #   touch tonight's freshly re-recorded data instead of skipping it all as "too hot."
      #   Put back to 30 once you're done testing, or compaction will keep rewriting
      #   actively-written buckets in production, which the lookback exists to prevent.
      max-compacted-files-per-batch: 8  # bounds one ducklake_merge_adjacent_files call's
      #   blast radius (its own max_compacted_files param). An unbounded call scans
      #   essentially the whole table — verified against ~184K real files, a single
      #   transient RustFS read failure anywhere in that scan discarded the entire
      #   call's progress, every run. Smaller batches mean one bad read costs one
      #   small batch, which CompactionService retries, not the whole table.
      # max-batches-per-run: 1000  # default — safety cap on how many batches one run
      #   will issue per entity type; a run that hits it just leaves the rest for
      #   next time.
      # row-group-memory-limit-mb: 256  # DuckDB 1.5.3+ write_buffer_row_group_memory_limit.
      #   Caps the Parquet writer's per-row-group memory budget so DuckLake flushes row groups
      #   by memory rather than row count during entity cassette merges.  Prevents OOM on large
      #   buckets.  Defaults to target-file-size-mb (256 MB).  Set to 0 to use the DuckDB default.
    general:
      enabled: false
      min-files-per-partition: 20
      target-file-size-mb: 256
      lookback-days: 30

  kafka:
    bootstrap-servers: "localhost:9092"
    # fetch-min-bytes: 1              # default — respond immediately (good for near-pace topics)
    #                                 # raise to 65536 on dedicated catchup nodes
    # max-poll-records: 2000          # default — raise further if lag remains and CPU allows
    # max-partition-fetch-bytes: 4194304  # default 4 MB per partition
    # max-poll-interval-ms: 900000    # default 15 min — safety margin above shared-connection
    #   lock contention from compaction/retention/snapshot operations (see docs/write-resilience.md
    #   "Kafka consumer poll interval vs. shared-connection lock contention"); Kafka's own
    #   5-minute default is not a safe floor here

  recording:
    batch-size: 10000
    batch-timeout-ms: 250   # reduced from 1000 ms — faster flush during catchup
    # Exponential backoff for recorder restart after Kafka failure.
    # Initial: 5 s → doubles each attempt → capped at 5 min.
    retry-initial-interval-ms: 5000
    retry-multiplier: 2.0
    retry-max-interval-ms: 300000

  threading:
    write-channel-capacity: 128
    compaction-thread-type: virtual
    write-retry-initial-ms: 1000     # first retry delay after a transient object-store failure
    write-retry-multiplier: 2.0      # backoff multiplier per attempt
    write-retry-max-ms: 60000        # cap on retry delay (1 minute)
    write-retry-max-attempts: 10     # escalate to actor restart after this many attempts (-1 = unlimited)
    quarantine-after-attempts: 5     # give up on a deterministically-failing (non-retryable) batch after this
                                      # many restarts and commit past it — CAUSES RECORD LOSS, see docs/write-resilience.md

  replay:
    # enabled: true   # set false to disable /cassettes/** endpoints on pure write-only nodes
    #                 # independent of the 'replay' role in joxette.roles — both must allow replay
    max-scheduled: 50

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173

  s3:
    endpoint: "http://localhost:9000"
    access-key: "joxettedev"
    secret-key: "joxettedev123"
    region: "us-east-1"

  # ---------------------------------------------------------------------------
  # Bootstrap seed: loaded only on first start when config tables are empty.
  #
  # Domain model:
  #   entity.type  — the logical entity name (e.g. "fixture").
  #                  One DuckLake table is created per entity type:
  #                  lake.entity_<type>
  #
  #   sources      — topics that carry messages about this entity.
  #     matchers   — one entry per message variant that references this entity.
  #                  The router tries matchers in declaration order and stops
  #                  at the first one that yields an ID.
  #       message-type  — label stored in the cassette's message_type column.
  #       source        — where to extract the ID: key | value | header
  #       expression    — JSONPath (for value) or header name (for header)
  #
  # All message variants for the same entity feed into the SAME cassette,
  # giving a unified timeline across message types.
  # ---------------------------------------------------------------------------
  bootstrap:
    topics:
      - topic: "events"
        mode: "both"   # record to general cassette AND index entities

    entities:
      # All sports-data entity types share the same topic ("events") and
      # use fixtureId as their identity key.  Each message variant is one
      # matcher under the single source mapping.
      - type: "fixture"
        buckets: 256
        sources:
          - topic: "events"
            mode: "entity_only"
            matchers:
              - message-type: "fixture"
                source: "value"
                expression: "$.fixture.id"
              - message-type: "marketSet"
                source: "value"
                expression: "$.marketSet.fixtureId"
              - message-type: "footballMatchSummary"
                source: "value"
                expression: "$.footballMatchSummary.fixtureId"
              - message-type: "resultSet"
                source: "value"
                expression: "$.resultSet.fixtureId"
              - message-type: "coverage"
                source: "value"
                expression: "$.coverage.fixtureId"
              - message-type: "footballMatchDetails"
                source: "value"
                expression: "$.footballMatchDetails.fixtureId"
