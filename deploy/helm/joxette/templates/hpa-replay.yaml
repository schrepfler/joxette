{{- include "joxette.validate" . -}}
{{- /*
HorizontalPodAutoscaler for the replay tier. Only valid with a shared catalog
(the guardrail rejects HPA + embedded) and when the replay tier is enabled.
Requires metrics-server in the cluster. The replay Deployment omits a static
replica count while this is enabled (see deployment-tiers.yaml).
*/}}
{{- if and (ne .Values.catalog.backend "embedded") .Values.tiers.replay.enabled .Values.tiers.replay.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "joxette.fullname" . }}-replay
  labels:
    {{- include "joxette.labels" . | nindent 4 }}
    app.kubernetes.io/component: replay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "joxette.fullname" . }}-replay
  minReplicas: {{ .Values.tiers.replay.hpa.minReplicas }}
  maxReplicas: {{ .Values.tiers.replay.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.tiers.replay.hpa.targetCPUUtilizationPercentage }}
    {{- if .Values.tiers.replay.hpa.activeReplaysMetric.enabled }}
    {{- /*
    Pods metric: average joxette_replay_active (active replay-to-topic ops) per
    pod. Replay is I/O-bound (SSE/NDJSON fan-out to slow clients) — many
    concurrent streams can saturate a pod at low CPU, which the Resource metric
    above misses entirely.
    Gated on its own flag (default false): this metric only resolves through a
    custom-metrics adapter (typically prometheus-adapter) exposing
    joxette_replay_active via custom.metrics.k8s.io — a real deployment
    prerequisite this chart does not install. HPA v2 computes a desired replica
    count per metric and scales UP to the MAX across all of them, so a
    resolving metric only ever scales out further than CPU alone. But if this
    metric FAILS to resolve (no adapter installed), HPA v2 semantics reject any
    scale-down recommendation outright while leaving scale-up on the other
    metrics untouched — so enabling this without the adapter silently ratchets
    the replay tier up to maxReplicas and it never scales back down. Only
    enable tiers.replay.hpa.activeReplaysMetric.enabled once the adapter is
    confirmed serving this metric.
    */}}
    - type: Pods
      pods:
        metric:
          name: joxette_replay_active
        target:
          type: AverageValue
          averageValue: {{ .Values.tiers.replay.hpa.targetActiveReplaysPerPod | quote }}
    {{- end }}
{{- end }}
